<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Sign Samples | Concord Signs & Graphics</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="service-page.css">
    <style>
        .samples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 0;
        }
        .sample-item {
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .sample-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .sample-item .caption {
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a href="../index.html" class="logo">
                    <span class="logo-text">Concord <span class="accent">Signs</span></span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-content">
            <h1 class="section-title">Parking Sign Samples</h1>
            <p>High quality, durable aluminum parking signs for your business.</p>
            
            <div class="samples-grid">
                <div class="sample-item">
                    <img src="../images/parking-1.jpg" alt="Parking Sign Sample 1">
                    <div class="caption">Parking Sign 1</div>
                </div>
                <div class="sample-item">
                    <img src="../images/parking-4.jpg" alt="Parking Sign Sample 4">
                    <div class="caption">Parking Sign 4</div>
                </div>
                <div class="sample-item">
                    <img src="../images/parking-3.jpg" alt="Parking Sign Sample 3">
                    <div class="caption">Parking Sign 3</div>
                </div>
                <div class="sample-item">
                    <img src="../images/parking-2.jpg" alt="Parking Sign Sample 2">
                    <div class="caption">Parking Sign 2</div>
                </div>
            </div>

            <div class="cta-section" style="text-align: center; margin: 40px 0;">
                <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Copyright © 1995-2026 Concord Signs & Graphics All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
